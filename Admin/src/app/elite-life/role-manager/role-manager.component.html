<div class="row">
  <div class="col-lg-12">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-24">
        <div class="d-flex w-100">
          <mat-card-title style="color: #B0903E;">Quản trị hệ thống</mat-card-title>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<div class="row">
  <div class="col-lg-12">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-24">
        <div class="d-flex w-100">
          <mat-card-title style="color: #B0903E;">Danh mục quyền</mat-card-title>
          <div class="m-l-auto">
            <p-button (onClick)="showAdd()" label="Thêm mới" severity="warning" icon="pi pi-plus" styleClass="m-0" [outlined]="true" />
          </div>
        </div>
        <div class="">
          <p-table
            [value]="data"
            [paginator]="true"
            [rows]="5"
            [tableStyle]="{ 'min-width': '50rem' }"
            [rowsPerPageOptions]="[5, 10, 20]"
          >
              <ng-template pTemplate="header">
                  <tr>
                      <th style="width:5%">Thao tác</th>
                      <th style="width:10%">Tên nhóm quyền</th>
                      <th style="width:30%">Danh sách quyền</th>
                  </tr>
              </ng-template>
              <ng-template pTemplate="body" let-customer>
                  <tr>
                    <td style="align-items: center;">
                      <i class="pi pi-pen-to-square" style="color: #B0903E; padding: 0 5px; cursor: pointer;" (click)="showEdit(customer)"></i>
                      <i class="pi pi-trash" style="color: red; padding: 0 5px;cursor: pointer;" (click)="deletePermission(customer)"></i>
                    </td>
                      <td>{{ customer.roleName }}</td>
                      <td>
                        <p-chip [ngStyle]="{ display: 'inline-block', margin: '5px' }" *ngFor="let item of customer?.permissions" label="{{item}}" />
                      </td>
                  </tr>
              </ng-template>
          </p-table>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>


<p-dialog 
  header="Header" 
  [(visible)]="visible" 
  [modal]="true" 
  [style]="{ width: '50rem' }">
    <ng-template pTemplate="header">
      <h3>Thêm Role</h3>
    </ng-template>
    <div class="row" style="margin: 10px 0;">
      <div class="d-flex col-6 w-100" style="flex-direction: column;">
        <label for="name" class="font-semibold">
          Name <span style="color: red">*</span>
        </label>
        <input pInputText [(ngModel)]="name" id="name" class="flex-auto" autocomplete="off" />
      </div>
      <div class="d-flex col-12 w-100" style="flex-direction: column;">
        <label for="code" class="font-semibold">
          Permission <span style="color: red">*</span>
        </label>
        <p-pickList 
          [source]="sourceProducts" 
          [target]="targetProducts" 
          sourceHeader="Danh sách chưa chọn" 
          targetHeader="Danh sách đã chọn" 
          [dragdrop]="true" 
          [responsive]="true" 
          [sourceStyle]="{ height: '30rem' }"
          [targetStyle]="{ height: '30rem' }" 
          filterBy="name" 
          breakpoint="1400px">
              <ng-template let-product pTemplate="item">
                  <div class="flex flex-wrap p-2 align-items-center gap-3">
                      <div class="flex-1 flex flex-column gap-2">
                          <span class="font-bold">
                              {{ product.name }}
                          </span>
                      </div>
                  </div>
              </ng-template>
        </p-pickList>
      </div>
      
    </div>
    <ng-template pTemplate="footer">
      <p-button 
          label="Hủy" 
          [text]="true" 
          severity="secondary" 
          (onClick)="visible = false" />
      <p-button 
          label="Thêm" 
          [outlined]="true" 
          severity="primary" 
          (onClick)="addPermission()"
        />
  </ng-template>
</p-dialog>

<p-dialog 
  header="Header" 
  [(visible)]="visibleEdit" 
  [modal]="true" 
  [style]="{ width: '50rem' }">
    <ng-template pTemplate="header">
      <h3>Chỉnh sửa Role</h3>
    </ng-template>
    <div class="row" style="margin: 10px 0;">
      <div class="d-flex col-6 w-100" style="flex-direction: column;">
        <label for="nameEdit" class="font-semibold">
          Name <span style="color: red">*</span>
        </label>
        <input pInputText [(ngModel)]="nameEdit" id="nameEdit" class="flex-auto" autocomplete="off" />
      </div>
      <div class="d-flex col-12 w-100" style="flex-direction: column;">
        <label for="code" class="font-semibold">
          Permission <span style="color: red">*</span>
        </label>
        <p-pickList 
          [source]="sourceProductsEdit" 
          [target]="targetProductsEdit" 
          sourceHeader="Danh sách chưa chọn" 
          targetHeader="Danh sách đã chọn" 
          [dragdrop]="true" 
          [responsive]="true" 
          [sourceStyle]="{ height: '30rem' }"
          [targetStyle]="{ height: '30rem' }" 
          filterBy="name" 
          breakpoint="1400px">
              <ng-template let-product pTemplate="item">
                  <div class="flex flex-wrap p-2 align-items-center gap-3">
                      <div class="flex-1 flex flex-column gap-2">
                          <span class="font-bold">
                              {{ product.permission_name }}
                          </span>
                      </div>
                  </div>
              </ng-template>
        </p-pickList>
      </div>
      
    </div>
    <ng-template pTemplate="footer">
      <p-button 
          label="Hủy" 
          [text]="true" 
          severity="secondary" 
          (onClick)="visibleEdit = false" />
      <p-button 
          label="Thêm" 
          [outlined]="true" 
          severity="primary" 
          (onClick)="updateRolePermission()"
        />
  </ng-template>
</p-dialog>
