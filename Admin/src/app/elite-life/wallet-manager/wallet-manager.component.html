<div class="row">
  <div class="col-lg-12">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-24">
        <div class="d-flex w-100">
          <mat-card-title style="color: #B0903E;">{{title}}</mat-card-title>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
<div class="row">
  <div class="col-lg-12">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-24">
        <div class="d-flex w-100">
          <mat-card-title style="color: #B0903E;">{{titleTable}}</mat-card-title>
          <div class="m-l-auto">
              <p-calendar 
                [(ngModel)]="date" 
                [iconDisplay]="'input'" 
                [showIcon]="true" 
                dateFormat="dd/mm/yy"
                (ngModelChange)="onDateChange($event)"
                inputId="icondisplay" />
            <p-button *ngIf="isPermissionExport" label="Xuất Excel" icon="pi pi-file-export" styleClass="m-0" [outlined]="true" (onClick)="exportWalletDetailAdmin()" />
          </div>
        </div>
        <div id="">
          <p-table
            [value]="data"
            [paginator]="true"
            [rows]="5"
            [loading]="isLoading"
            [tableStyle]="{ 'min-width': '50rem' }"
            [rowsPerPageOptions]="[5, 10, 20]"
          >
              <ng-template pTemplate="header">
                  <tr>
                    <th style="width:25%">Nội dung</th>
                    <th style="width:15%">
                      Số tiền
                    </th>
                    <th style="width:15%">Ngày tạo</th>
                    <th style="width:10%">Trạng thái</th>
                  </tr>
              </ng-template>
              <ng-template pTemplate="body" let-customer>
                  <tr>
                    <td>{{ customer.note }}</td>
                    <td>{{ customer.value }}</td>
                    <td>{{ customer.createdAt | date: 'dd/MM/yyyy hh:mm:ss' }}</td>
                    <td>Thành công</td>
                  </tr>
              </ng-template>
          </p-table>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<div class="row">
  <div class="col-lg-12">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-24">
        <div class="d-flex w-100">
          <mat-card-title style="color: #B0903E;">{{titleChart}}</mat-card-title>
          <div class="m-l-auto">
          </div>
        </div>
        <div id="chart">
          <apx-chart
            [series]="chartOptions.series"
            [chart]="chartOptions.chart"
            [dataLabels]="chartOptions.dataLabels"
            [plotOptions]="chartOptions.plotOptions"
            [yaxis]="chartOptions.yaxis"
            [xaxis]="chartOptions.xaxis"
            [fill]="chartOptions.fill"
            [title]="chartOptions.title"
          ></apx-chart>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
