<div class="row">
  <div class="col-lg-12">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-24">
        <div class="d-flex w-100">
          <mat-card-title style="color: #B0903E;">Quản trị hệ thống</mat-card-title>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<div class="row">
  <div class="col-lg-12">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-24">
        <div class="d-flex w-100">
          <mat-card-title style="color: #B0903E;">Danh mục quyền</mat-card-title>
          <div class="m-l-auto">
            <p-button (onClick)="showAdd()" label="Thêm mới" severity="warning" icon="pi pi-plus" styleClass="m-0" [outlined]="true" />
          </div>
        </div>
        <div class="">
          <p-table
            [value]="data"
            [paginator]="true"
            [rows]="5"
            [tableStyle]="{ 'min-width': '50rem' }"
            [rowsPerPageOptions]="[5, 10, 20]"
          >
              <ng-template pTemplate="header">
                  <tr>
                    <th style="width:5%">Thao tác</th>
                    <th style="width:10%">
                      Tên chức năng
                    </th>
                    <th style="width:10%">Mã quyền</th>
                    <th style="width:20%">Tên quyền</th>
                    <th style="width:5%">Hoạt động</th>
                  </tr>
                  <tr>
                    <th></th>
                    <th>
                      <p-columnFilter 
                        type="text"
                        field="controller" 
                        placeholder="" 
                        ariaLabel="Filter Name" />
                    </th>
                    <th>
                      <p-columnFilter 
                        type="text"
                        field="code"
                        placeholder="" 
                        ariaLabel="Filter Country" />
                    </th>
                    <th>
                      <p-columnFilter 
                        type="text"
                        field="name"
                        placeholder="" 
                        ariaLabel="Filter Country" />
                    </th>
                    <th>
                      <p-columnFilter 
                        type="text"
                        field="action"
                        placeholder="" 
                        ariaLabel="Filter Country" />
                    </th>
                  </tr>
              </ng-template>
              <ng-template pTemplate="body" let-customer>
                  <tr>
                    <td style="align-items: center;">
                      <i class="pi pi-pen-to-square" style="color: #B0903E; padding: 0 5px; cursor: pointer;" (click)="showEdit(customer)"></i>
                      <i class="pi pi-trash" style="color: red; padding: 0 5px;cursor: pointer;" (click)="deletePermission(customer)"></i>
                    </td>
                      <td>{{ customer.controller }}</td>
                      <td>{{ customer.code }}</td>
                      <td>{{ customer.name}}</td>
                      <td>{{ customer.action }}</td>
                  </tr>
              </ng-template>
          </p-table>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>


<p-dialog 
  header="Header" 
  [(visible)]="visible" 
  [modal]="true" 
  [style]="{ width: '50rem' }">
    <ng-template pTemplate="header">
      <h3 style="color: #B0903E;">Thêm quyền</h3>
    </ng-template>
    <div class="row" style="margin: 10px 0;">
      <div class="d-flex col-6 w-100" style="flex-direction: column;">
        <label for="name" class="font-semibold">
          Tên quyền <span style="color: red">*</span>
        </label>
        <input pInputText [(ngModel)]="name" id="name" class="flex-auto" autocomplete="off" />
      </div>
      <div class="d-flex col-6 w-100" style="flex-direction: column;">
        <label for="code" class="font-semibold">
          Mã quyền <span style="color: red">*</span>
        </label>
        <input pInputText [(ngModel)]="code" id="code" class="flex-auto" autocomplete="off" [readOnly]="true" />
      </div>
      <div class="d-flex col-6 w-100" style="flex-direction: column;">
        <label for="action" class="font-semibold">
          Hành động <span style="color: red">*</span>
        </label>
        <p-dropdown
          [options]="actionList"
          appendTo="body"
          [(ngModel)]="action"
          [autoDisplayFirst]="true"
          [filter]="true"
          filterBy="label,value"
          (onChange)="onChangeAction($event)"
        >
        </p-dropdown>
      </div>
      <div class="d-flex col-6 w-100" style="flex-direction: column;">
        <label for="funtion" class="font-semibold">
          Chức năng <span style="color: red">*</span>
        </label>
        <p-dropdown
          [options]="functionList"
          appendTo="body"
          [(ngModel)]="function"
          [autoDisplayFirst]="true"
          [filter]="true"
          filterBy="label,value"
          (onChange)="onChangeFunction($event)"
        >
        </p-dropdown>
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button 
          label="Hủy" 
          [text]="true" 
          severity="secondary" 
          (onClick)="visible = false" />
      <p-button 
          label="Thêm" 
          [outlined]="true" 
          severity="primary" 
          (onClick)="addPermission()"
        />
  </ng-template>
</p-dialog>

<p-dialog 
  header="Header" 
  [(visible)]="visibleEdit" 
  [modal]="true" 
  [style]="{ width: '50rem' }">
    <ng-template pTemplate="header">
      <h3 style="color: #B0903E;">Chỉnh sửa quyền</h3>
    </ng-template>
    <div class="row" style="margin: 10px 0;">
      <div class="d-flex col-6 w-100" style="flex-direction: column;">
        <label for="nameEdit" class="font-semibold">
          Tên quyền <span style="color: red">*</span>
        </label>
        <input pInputText [(ngModel)]="nameEdit" id="nameEdit" class="flex-auto" autocomplete="off" />
      </div>
      <div class="d-flex col-6 w-100" style="flex-direction: column;">
        <label for="codeEdit" class="font-semibold">
          Mã quyền <span style="color: red">*</span>
        </label>
        <input pInputText [(ngModel)]="codeEdit" id="codeEdit" class="flex-auto" autocomplete="off"  />
      </div>
      <div class="d-flex col-6 w-100" style="flex-direction: column;">
        <label for="actionEdit" class="font-semibold">
          Hành động <span style="color: red">*</span>
        </label>
        <p-dropdown
          [options]="actionList"
          appendTo="body"
          [(ngModel)]="actionEdit"
          [autoDisplayFirst]="true"
          [filter]="true"
          filterBy="label,value"
          (onChange)="onChangeActionEdit($event)"
        >
        </p-dropdown>
      </div>
      <div class="d-flex col-6 w-100" style="flex-direction: column;">
        <label for="funtionEdit" class="font-semibold">
          Chức năng <span style="color: red">*</span>
        </label>
        <p-dropdown
          [options]="functionList"
          appendTo="body"
          [(ngModel)]="functionEdit"
          [autoDisplayFirst]="true"
          [filter]="true"
          filterBy="label,value"
          (onChange)="onChangeFunctionEdit($event)"
        >
        </p-dropdown>
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button 
          label="Hủy" 
          [text]="true" 
          severity="secondary" 
          (onClick)="visibleEdit = false" />
      <p-button 
          label="Chỉnh sửa" 
          [outlined]="true" 
          severity="primary" 
          (onClick)="updatePermission()"
        />
  </ng-template>
</p-dialog>
