<div class="row">
  <div class="col-lg-12">
    <mat-card class="cardWithShadow p-24">
      <div class="row">
        <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
          <h2>Quản trị hệ thống</h2>
        </div>
        <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
          <div class="d-flex justify-content-end">
            <p-calendar [(ngModel)]="rangeDates" selectionMode="range" [showIcon]="true"
              [ngStyle]="{'margin-right': '10px'}" (onSelect)="onDateChange($event)" [readonlyInput]="true" />
              <p-button *ngIf="isPermissionExport" (onClick)="test()" label="Xuất Excel" severity="warning" icon="pi pi-file-export"
              styleClass="m-0" [outlined]="true" />
          </div>
        </div>
      </div>
    </mat-card>
  </div>
</div>

<div class="row">
  <div class="col-lg-12">
    <mat-card class="cardWithShadow">
      <mat-card-content class="p-24">
        <div class="d-flex w-100 justify-content-between my-20">
          <mat-card-title style="color: #B0903E;">Quản lý tài khoản</mat-card-title>
          <div class=" ">
            <p-button ngClass="format-button" label=" + Thêm mới " severity="success" styleClass="my-20" class="my-20"
            (click)="test()" />
          </div>
        </div>
        <div class="">
          <p-table #dt2 [value]="test" [paginator]="true" [rows]="5"
            [globalFilterFields]="['name', 'userName', 'createdAt', 'rank']" [tableStyle]="{ 'min-width': '50rem' }"
            [rowsPerPageOptions]="[5, 10, 20]">
            <ng-template pTemplate="header" style="color: #B0903E;">
              <tr>
                <th style="width:15%">Thao tác</th>
                <th style="width:10%">Ảnh đại diện</th>
                <th style="width:20%">Tên đăng nhập</th>
                <th style="width:30%">Họ và tên</th>
                <th style="width:25%">Email</th>
              </tr>
              <tr>
                <th></th>
                <th></th>
                <th>
                  <p-columnFilter type="text" field="userName" placeholder="" ariaLabel="Filter Name" />
                </th>
                <th>
                  <p-columnFilter type="text" field="name" placeholder="" ariaLabel="Filter Country" />
                </th>
                <th>
                  <p-columnFilter type="text" field="email" placeholder="" ariaLabel="Filter Country" />
                </th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-customer>
              <tr>
                <td style="align-items: center;">
                  <i class="pi pi-pen-to-square" *ngIf="test" style="color: #B0903E; padding: 0 5px; cursor: pointer;" (click)="test(customer)"></i>
                  <i class="pi pi-trash" style="color: red; padding: 0 5px;cursor: pointer;" (click)="test(customer)"></i>
                  <i class="pi pi-bars" style=" padding: 0 5px;cursor: pointer;" (click)="menu.toggle($event)" (click)="test(customer)"></i>
                  <p-tieredMenu
                    #menu
                    [model]="test"
                    [popup]="true"
                    appendTo="body"
                    [baseZIndex]="1000">
                  </p-tieredMenu>
                </td>
                <td>{{ customer.name }}</td>
                <td>{{ customer.userName }}</td>
                <td>{{ customer.createdAt | date: 'dd/MM/yyyy hh:mm:ss' }}</td>
                <td>{{ customer.rank }}</td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
