<div class="blank-layout-container justify-content-center align-items-center bg-light-primary">
  <div
    class="position-relative row w-100 h-100 bg-gredient"
    [ngClass]="{ 'justify-content-end': !isSmallScreen, 'justify-content-center': isSmallScreen }"
  >
  <p-toast />
    <div class="col-lg-8 p-0" *ngIf="!isSmallScreen">
      <img
        src="/assets/images/elite-live/background-login.jpg"
        alt="login"
        style="width: 100%; height: 100vh; display: block;"
      />
    </div>
    <div class="col-lg-4 d-flex align-items-center p-0 justify-content-center" >
      <mat-card class="cardWithShadow boxed-auth" style="height: 100%; margin: 0; max-width: none; padding-top: 10%;">
        <mat-card-content  style="padding: auto;">
          <div class="text-center">
            <a [routerLink]="['/dashboard']">
              <img
                src="./assets/images/elite-live/logo-elitelive.jpg"
                class="align-middle m-2"
                alt="logo"
              />
            </a>
          </div>
          <div class="or-border m-t-30"><h1 style="color: #B0903E;">Đăng nhập</h1></div>

          <form #form="ngForm" class="m-t-30">
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block"  style="color: #B0903E;"
              >Mã đăng nhập <span style="color: red">*</span></mat-label
            >
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input [(ngModel)]="userName" name="userName" placeholder="Nhập mã đăng nhập" matInput />
            </mat-form-field>
            <!-- password -->
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block"  style="color: #B0903E;"
              >Mật khẩu <span style="color: red">*</span></mat-label
            >
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input  [(ngModel)]="passWord" name="passWord" matInput placeholder="Nhập mật khẩu" [type]="hide ? 'password' : 'text'" required>
              <button mat-icon-button matSuffix (click)="hide = !hide" type="button">
                <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>

            <div class="d-flex align-items-center m-b-12">
              <mat-checkbox color="primary">Ghi nhớ mật khẩu</mat-checkbox>
              <a
                [routerLink]="['/']"
                class="f-w-600 text-decoration-none m-l-auto f-s-14" style="color: #B0903E;"
                (click)="showForgotPassword()"
                >Quên mật khẩu ?</a
              >
            </div>
            <re-captcha id="recaptcha" name="recaptcha" #recaptcha="ngModel" [(ngModel)]="token" required [class.is-invalid]="recaptcha.invalid && (recaptcha.dirty || recaptcha.touched)"></re-captcha>
            <div *ngIf="recaptcha.invalid && (recaptcha.dirty || recaptcha.touched)" class="invalid-feedback">
              <div *ngIf="recaptcha.errors?.['required']" style="color: red;padding: 10px 0;">Vui lòng xác thực capcha.</div>
            </div>
            <!-- <a [routerLink]="['/']" mat-flat-button color="primary" class="w-100" (click)="login(form)">
              Đăng nhập
            </a> -->
            <button mat-flat-button style="background-color: #B0903E; color: #fff;"  class="w-100" (click)="login(form)">
              Đăng nhập
            </button>
            <!-- input -->
          </form>
          <span class="d-block f-w-500 text-center m-t-24"
            >Bạn chưa có tài khoản?
            <a
              [routerLink]="['/authentication/register']"
              class="text-decoration-none text-primary f-w-500 f-s-14"
            >
              Tạo tài khoản</a
            >
          </span>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>

<p-dialog 
  header="Header" 
  [(visible)]="visibleForgotPassword" 
  [modal]="true">
    <ng-template pTemplate="header">
      <h3 style="color: #B0903E;">Quên mật khẩu</h3>
    </ng-template>
    <div class="row">
      <div class="d-flex" style="flex-direction: column;">
        <label for="userNameForgotPassword" class="font-semibold">
          Mã đăng nhập 
        </label>
        <mat-form-field appearance="outline" class="w-100" color="primary">
          <input [(ngModel)]="userNameForgotPassword" name="userNameForgotPassword" placeholder="Nhập mã đăng nhập" matInput />
        </mat-form-field>
      </div>
      
    </div>
    <ng-template pTemplate="footer">
      <p-button 
        label="Hủy" 
        [text]="true" 
        severity="secondary" 
        (onClick)="visibleForgotPassword = false" />
      <p-button 
        label="Xác nhận" 
        [outlined]="true" 
        severity="secondary"
        (onClick)="forgotPassword()"
        />
  </ng-template>
</p-dialog>

<p-dialog header="Confirm OTP" [modal]="true" [(visible)]="visible" [style]="{ width: '30rem' }">
  <div class="flex flex-column align-items-center">
    <div class="font-bold text-xl mb-2">Xác thực tài khoản của bạn</div>
    <p class="text-color-secondary block mb-3">Vui lòng nhập mã được gửi tới email {{Email}} của bạn.</p>
    <p-inputOtp [(ngModel)]="value" [length]="6" style="gap: 0">
        <ng-template pTemplate="input" let-token let-events="events" let-index="index">
            <input
                pInputText
                type="text"
                [maxLength]="1"
                (input)="events.input($event)"
                (keydown)="events.keydown($event)"
                [attr.value]="token"
                class="custom-otp-input col-1 m-2" />
            <div *ngIf="index === 3" class="px-3">
                <i class="pi pi-minus"></i>
            </div>
        </ng-template>
    </p-inputOtp>
    <div class="d-flex" style="flex-direction: column;">
      <label for="newPassWord" class="font-semibold">
        Nhập mật khẩu mới 
      </label>
      <mat-form-field appearance="outline" class="w-100" color="primary">
        <input [(ngModel)]="newPassWord" name="newPassWord" [type]="hide ? 'password' : 'text'" matInput />
        <button mat-icon-button matSuffix (click)="hide = !hide" type="button">
          <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
    </div>
    <div class="d-flex" style="flex-direction: column;">
      <label for="confirmNewPassWord" class="font-semibold">
        Nhập lại mật khẩu mới 
      </label>
      <mat-form-field appearance="outline" class="w-100" color="primary">
        <input [(ngModel)]="confirmNewPassWord" name="confirmNewPassWord" [type]="hide1 ? 'password' : 'text'" matInput />
        <button mat-icon-button matSuffix (click)="hide1 = !hide1" type="button">
          <mat-icon>{{ hide1 ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
    </div>
    <p class="text-color-secondary block mb-3">Send OTP again({{countdown}}s)</p>
    <div class="flex justify-content-between mt-3 align-self-stretch">
        <p-button label="Resend Code" [link]="true" [disabled]="countdown > 0" (onClick)="resendCode()" class="p-0"/>
        <p-button (onClick)="submitOTP()" label="Submit Code"/>
    </div>
  </div>
</p-dialog>
